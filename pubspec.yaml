name: secure_vault
description: "A new Flutter project."

publish_to: 'none' 

# The following defines the version and build number for your application.
version: 1.0.0+4

environment:
  sdk: ^3.11.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.8.0

  # Storage & Encryption
  hive_ce: any
  hive_ce_flutter: any
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5

  # Cryptography & Security
  pointycastle: ^3.9.1
  local_auth: ^2.3.0
  crypto: ^3.0.3

  # Models & Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0

  # UI & Icons
  flutter_svg: ^2.0.10+1
  web: ^1.1.1
  lucide_icons_flutter: ^3.1.14+2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

  # Code Generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  hive_ce_generator: any

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/png/
    - assets/images/svg/
    - assets/fonts/

  fonts:
    - family: Helvetica
      fonts:
        - asset: assets/fonts/Helvetica-Light.ttf
          weight: 300
        - asset: assets/fonts/Helvetica-Regular.ttf
          weight: 400
        - asset: assets/fonts/Helvetica-Bold.ttf
          weight: 700
    - family: Helvetica Rounded LT Std
      fonts:
        - asset: assets/fonts/Helvetica-Rounded-Bold.otf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/png/securevault_app_icon.png"
  web:
    generate: true
    image_path: "assets/images/png/securevault_app_icon.png"
  macos:
    generate: true
    image_path: "assets/images/png/securevault_app_icon.png"